{{- /* Docusaurus' reading time: 200 words per minute, rounded up. */ -}}
{{- $min := math.Max 1 (math.Ceil (div (float .WordCount) 200)) -}}
<div class="container_mt6G margin-vert--md"><time datetime="{{ .Date.UTC.Format "2006-01-02T15:04:05.000Z" }}">{{ .Date.Year }}年{{ .Date.Month | int }}月{{ .Date.Day }}日</time> · 阅读需 {{ $min }} 分钟</div>
